name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, content check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:content
      - run: npm run build

  deploy:
    name: Deploy to Netlify
    needs: check
    runs-on: ubuntu-latest
    # Turned on by the repository variable NETLIFY_ENABLED=true, set after adding the two Netlify secrets.
    if: ${{ vars.NETLIFY_ENABLED == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy production (main)
        if: github.event_name == 'push'
        run: npx netlify deploy --prod --message "main @ ${GITHUB_SHA::7}"
      - name: Deploy preview (pull request)
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          npx netlify deploy --alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }}" --json > deploy.json
          echo "url=$(node -p "require('./deploy.json').deploy_url")" >> "$GITHUB_OUTPUT"
      - name: Comment preview link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview: ${{ steps.preview.outputs.url }}`,
            })
