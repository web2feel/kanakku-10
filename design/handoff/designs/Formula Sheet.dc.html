<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
</helmet>
<button onClick="{{ open }}" style="display:flex;align-items:center;gap:8px;font-family:Figtree;font-weight:600;font-size:15px;padding:10px 16px;border-radius:999px;background:#FFFFFF;color:#1F2A44;border:2px solid #1F2A44;box-shadow:3px 3px 0 #1F2A44;cursor:pointer;white-space:nowrap;" style-hover="transform:translate(-1px,-1px);box-shadow:4px 4px 0 #1F2A44;">
  <span style="font-family:'Bricolage Grotesque';font-weight:800;">∑</span> Formula sheet
</button>
<div onClick="{{ close }}" style="position:fixed;inset:0;background:rgba(31,42,68,0.45);z-index:50;opacity:{{ backdropOpacity }};pointer-events:{{ backdropEvents }};transition:opacity .22s;"></div>
<aside role="dialog" aria-modal="true" aria-label="Formula sheet" style="position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);box-sizing:border-box;background:#FBF6EC;border-left:2px solid #1F2A44;z-index:51;display:flex;flex-direction:column;transform:{{ panelTransform }};transition:transform .22s ease;font-family:Figtree;color:#1F2A44;">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 24px;border-bottom:2px solid #1F2A44;background:#FFD25A;">
    <div style="display:flex;flex-direction:column;gap:0;">
      <span style="font-family:Caveat;font-size:22px;line-height:1;color:#8A6200;">keep it handy</span>
      <h2 style="margin:0;font-family:'Bricolage Grotesque';font-weight:800;font-size:28px;letter-spacing:-0.02em;">Formula sheet</h2>
    </div>
    <button onClick="{{ close }}" style="font-family:Figtree;font-weight:700;font-size:15px;padding:8px 14px;border-radius:12px;border:2px solid #1F2A44;background:#FFFFFF;color:#1F2A44;cursor:pointer;">Close</button>
  </div>
  <div style="flex:1;overflow-y:auto;padding:20px 24px 32px;display:flex;flex-direction:column;gap:22px;">
    <section style="display:flex;flex-direction:column;gap:10px;">
      <h3 style="margin:0;font-family:'Bricolage Grotesque';font-weight:800;font-size:18px;">Standard values</h3>
      <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#FFFFFF;border:2px solid #1F2A44;border-radius:16px;overflow:hidden;text-align:center;font-size:15px;">
        <sc-for list="{{ tableCells }}" as="c" hint-placeholder-count="24">
          <div style="padding:8px 4px;min-height:40px;display:flex;align-items:center;justify-content:center;background:{{ c.bg }};font-weight:{{ c.w }};color:{{ c.color }};border-top:1.5px solid #F1E8D6;font-size:{{ c.size }};">
            <sc-if value="{{ c.frac }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;"><span>{{ c.n }}</span><span style="border-top:1.5px solid #1F2A44;padding-top:1px;">{{ c.d }}</span></span></sc-if>
            <sc-if value="{{ c.plain }}" hint-placeholder-val="{{ true }}"><span>{{ c.t }}</span></sc-if>
          </div>
        </sc-for>
      </div>
    </section>
    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="4">
      <section style="display:flex;flex-direction:column;gap:10px;">
        <h3 style="margin:0;font-family:'Bricolage Grotesque';font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;"><span style="width:12px;height:12px;border-radius:4px;background:{{ s.dot }};border:1.5px solid #1F2A44;"></span>{{ s.title }}</h3>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <sc-for list="{{ s.items }}" as="it" hint-placeholder-count="3">
            <div style="display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;background:#FFFFFF;border:1.5px solid #EADFC9;border-radius:14px;padding:10px 14px;font-size:16px;">
              <sc-for list="{{ it }}" as="f" hint-placeholder-count="2">
                <span style="display:inline-flex;align-items:center;gap:4px;white-space:nowrap;">
                  <sc-for list="{{ f }}" as="g" hint-placeholder-count="2">
                    <sc-if value="{{ g.isText }}" hint-placeholder-val="{{ true }}"><span style="white-space:pre;">{{ g.t }}</span></sc-if>
                    <sc-if value="{{ g.isFrac }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;font-size:0.88em;margin:0 2px;"><span style="padding:0 2px;">{{ g.n }}</span><span style="border-top:1.5px solid #1F2A44;padding:1px 2px 0;">{{ g.d }}</span></span></sc-if>
                  </sc-for>
                </span>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;700px&quot;},&quot;startOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: !!this.props.startOpen };
  componentDidMount() {
    this.onKey = e => { if (e.key === 'Escape') this.setState({ open: false }); };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }
  renderVals() {
    const T = t => ({ isText: true, isFrac: false, t });
    const F = (n, d) => ({ isText: false, isFrac: true, n, d });
    const open = this.state.open;
    const head = ['', '0°', '30°', '45°', '60°', '90°'];
    const rows = [
      ['sin', '0', F('1', '2'), F('1', '√2'), F('√3', '2'), '1'],
      ['cos', '1', F('√3', '2'), F('1', '√2'), F('1', '2'), '0'],
      ['tan', '0', F('1', '√3'), '1', '√3', 'undef.'],
    ];
    const tableCells = [
      ...head.map(t => ({ plain: true, frac: false, t, bg: '#F4EDDF', w: 700, color: '#5B6478', size: '13px' })),
      ...rows.flatMap(r => r.map((c, j) => typeof c === 'string'
        ? { plain: true, frac: false, t: c, bg: '#FFFFFF', w: j === 0 ? 700 : 500, color: c === 'undef.' ? '#7A8296' : '#1F2A44', size: c === 'undef.' ? '12px' : '15px' }
        : { ...c, plain: false, frac: true, bg: '#FFFFFF', w: 500, color: '#1F2A44', size: '14px' })),
    ];
    const sections = [
      { title: 'The six ratios', dot: '#FFE1D6', items: [
        [[T('sin θ ='), F('opp', 'hyp')], [T('cos θ ='), F('adj', 'hyp')], [T('tan θ ='), F('opp', 'adj')]],
        [[T('cosec θ ='), F('1', 'sin θ')], [T('sec θ ='), F('1', 'cos θ')], [T('cot θ ='), F('1', 'tan θ')]],
        [[T('tan θ ='), F('sin θ', 'cos θ')], [T('cot θ ='), F('cos θ', 'sin θ')]],
      ] },
      { title: 'Complementary angles', dot: '#CDEFE0', items: [
        [[T('sin(90° − θ) = cos θ')], [T('cos(90° − θ) = sin θ')]],
        [[T('tan(90° − θ) = cot θ')], [T('cot(90° − θ) = tan θ')]],
        [[T('sec(90° − θ) = cosec θ')], [T('cosec(90° − θ) = sec θ')]],
      ] },
      { title: 'Fundamental identities', dot: '#E6E0FB', items: [
        [[T('sin²θ + cos²θ = 1')]], [[T('1 + tan²θ = sec²θ')]], [[T('1 + cot²θ = cosec²θ')]],
      ] },
      { title: 'Heights and distances', dot: '#D7ECFF', items: [
        [[T('tan θ ='), F('height', 'horizontal distance')]],
        [[T('sin θ ='), F('height', 'line of sight')], [T('cos θ ='), F('distance', 'line of sight')]],
        [[T('√3 ≈ 1.732')], [T('√2 ≈ 1.414')]],
      ] },
    ];
    return {
      tableCells, sections,
      open: () => this.setState({ open: true }), close: () => this.setState({ open: false }),
      panelTransform: open ? 'translateX(0)' : 'translateX(105%)',
      backdropOpacity: open ? 1 : 0, backdropEvents: open ? 'auto' : 'none',
    };
  }
}
</script>
</body>
</html>
